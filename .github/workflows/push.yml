# Exam / event notifications. Every 30 minutes, ~05:00-23:30 Israel time (summer + winter);
# the settings in the app (הגדרות → התראות) decide whether there is anything to send. "Run workflow" with force = 1 sends a test.
name: push-notifications
on:
  schedule:
    - cron: "5,35 2-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "1 = send a test notification now"
        default: "1"
concurrency: { group: push, cancel-in-progress: false }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/push }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
        working-directory: .github/push
      - run: node send.mjs
        working-directory: .github/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FORCE: ${{ github.event.inputs.force }}
